<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4D8FCB">
<meta name="description" content="Protótipo navegável do app FindHome Pets: adoção de cães e gatos com dados fictícios.">
<title>FindHome Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: protótipo em moldura de celular ao lado de um guia de teste (desktop); app em tela cheia no celular.
   Tema único, por escolha: o app segue a identidade clara da marca FindHome Pets. */
:root{
  --amarelo:#F8D978; --amarelo-forte:#F2BE2E; --creme:#FFF7DE;
  --azul:#4D8FCB; --azul-escuro:#285A84; --azul-claro:#E5EFF9;
  --branco:#FFFFFF; --fundo:#F4F7FB; --tinta:#1B3148; --cinza:#5E7186; --linha:#DCE5EF;
  --ok:#1F7D52; --ok-bg:#E1F3E8; --aviso:#8A5D00; --aviso-bg:#FFF0C4; --erro:#BD3535; --erro-bg:#FBE6E6;
  --palco:#D9E6F3; --moldura:#132A40;
  --f:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-sm:12px; --r:18px; --r-lg:24px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{box-sizing:border-box;height:100%}
body{height:100%;margin:0;background:var(--palco);color:var(--tinta);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
:focus-visible{outline:3px solid var(--amarelo-forte);outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.ic.sm{width:16px;height:16px}

/* ---------- palco (desktop) ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-inline:24px}
.phone{width:390px;height:min(844px,calc(100vh - 48px));min-height:600px;border:10px solid var(--moldura);border-radius:48px;background:var(--fundo);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(19,42,64,.45),0 0 0 2px #2A4560 inset;flex:none}
.statusbar{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding-inline:26px 22px;font-weight:800;font-size:14px;background:inherit;position:relative;z-index:3}
.statusbar .notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:26px;border-radius:20px;background:var(--moldura)}
.statusbar .sinais{display:flex;gap:5px;align-items:center}
.statusbar .sinais i{display:block;width:4px;background:var(--tinta);border-radius:2px}
#app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--fundo)}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;scroll-behavior:smooth}
.screen>*{flex-shrink:0}
.pad{padding-inline:20px}

.guia{width:360px;max-width:100%;color:var(--tinta)}
.guia .marca{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.guia h2{font-size:26px;font-weight:900;margin-bottom:8px}
.guia p{color:var(--cinza);margin-bottom:18px}
.guia h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--azul-escuro);font-weight:900;margin:22px 0 10px}
.contas{display:grid;gap:8px}
.conta{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r-sm);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.conta b{font-weight:800}
.conta span{color:var(--cinza);font-size:13px;font-variant-numeric:tabular-nums;user-select:all}
.conta .tag{grid-row:span 2;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:8px;background:var(--azul-claro);color:var(--azul-escuro)}
.conta .tag.p{background:var(--creme);color:var(--aviso)}
.roteiro{margin:0;padding-left:22px;display:grid;gap:8px;color:var(--tinta)}
.roteiro li::marker{font-weight:900;color:var(--azul)}
.guia .rodape{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}

@media (max-width:820px){
  .stage{display:block;padding:0;height:100%}
  .guia{display:none}
  .phone{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
}

/* ---------- marca ---------- */
.wordmark{font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.wordmark .a{color:var(--azul)} .wordmark .b{color:var(--amarelo-forte)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;border:0;font-weight:800;font-size:16px;background:var(--azul);color:var(--branco);width:100%;transition:transform .12s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#3F80BE}
.btn.escuro{background:var(--azul-escuro)}
.btn.sec{background:var(--branco);color:var(--azul-escuro);border:2px solid var(--linha)}
.btn.sec:hover{border-color:var(--azul)}
.btn.amarelo{background:var(--amarelo);color:var(--tinta)}
.btn.perigo{background:var(--erro)}
.btn.texto{background:none;color:var(--azul-escuro);min-height:44px;width:auto;padding:0 8px}
.btn[disabled]{background:var(--linha);color:var(--cinza);cursor:not-allowed}
.btn.peq{min-height:40px;font-size:14px;border-radius:12px;padding:0 14px;width:auto}
.icon-btn{width:44px;height:44px;border-radius:14px;border:0;background:var(--branco);display:grid;place-items:center;color:var(--tinta);box-shadow:0 2px 6px rgba(27,49,72,.08);flex:none}
.link{background:none;border:0;padding:0;color:var(--azul-escuro);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* ---------- splash / onboarding ---------- */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--branco);text-align:center}
.splash .wordmark{font-size:34px}
.splash p{color:var(--cinza);font-weight:700}
.splash .logo-mark{animation:pulo .9s ease-out both}
@keyframes pulo{0%{transform:translateY(12px) scale(.9);opacity:.3}100%{transform:none;opacity:1}}
.onb{flex:1;display:flex;flex-direction:column;background:var(--branco)}
.onb .topo{display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
.onb .ilus{margin:8px 20px 0;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:5/4;max-width:100%}
.onb .ilus svg{display:block;width:100%;height:100%}
.onb .txt{padding:28px 24px 0;flex:1}
.onb h1{font-size:28px;font-weight:900;margin-bottom:12px}
.onb .txt p{color:var(--cinza);font-size:16px}
.dots{display:flex;gap:6px;padding:0 24px 18px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--linha);transition:width .2s}
.dots i.on{width:26px;background:var(--azul)}
.onb .acoes{padding:0 20px 24px}

/* ---------- formulários ---------- */
.auth{background:var(--branco);flex:1}
.auth .cab{padding:20px 20px 4px;display:flex;flex-direction:column;gap:10px}
.auth h1{font-size:28px;font-weight:900}
.auth .sub{color:var(--cinza)}
form.f{display:flex;flex-direction:column;gap:16px;padding:20px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo>label,.campo>.rot{font-weight:800;font-size:14px}
.campo .dica{font-size:13px;color:var(--cinza)}
.inp{width:100%;min-height:50px;border:2px solid var(--linha);border-radius:14px;padding:12px 14px;font-size:16px;background:var(--branco);transition:border-color .15s}
.inp:focus{outline:none;border-color:var(--azul)}
textarea.inp{min-height:110px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--cinza) 50%),linear-gradient(135deg,var(--cinza) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.inp.inv{border-color:var(--erro);background:var(--erro-bg)}
.err{color:var(--erro);font-size:13px;font-weight:700;min-height:0}
.err:empty{display:none}
.senha-wrap{position:relative}
.senha-wrap .inp{padding-right:52px}
.senha-wrap button{position:absolute;right:4px;top:3px;width:44px;height:44px;border:0;background:none;color:var(--cinza);display:grid;place-items:center}
.alerta{border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--erro-bg);color:var(--erro)}
.alerta:empty{display:none}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.op{position:relative}
.op input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.op span{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-radius:12px;border:2px solid var(--linha);background:var(--branco);font-weight:700;font-size:14px;transition:all .15s}
.op input:checked+span{border-color:var(--azul);background:var(--azul-claro);color:var(--azul-escuro)}
.op input:focus-visible+span{outline:3px solid var(--amarelo-forte);outline-offset:2px}
.perfil-op{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.perfil-op .op span{flex-direction:column;align-items:flex-start;gap:4px;min-height:auto;padding:14px;border-radius:16px;width:100%;height:100%}
.perfil-op .op{display:flex}
.perfil-op b{font-size:15px;font-weight:900}
.perfil-op small{font-size:12.5px;color:var(--cinza);font-weight:600;line-height:1.35}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--azul);flex:none}
.cores{display:flex;gap:10px}
.cores .op span{width:40px;height:40px;padding:0;border-radius:50%;border:3px solid var(--branco);box-shadow:0 0 0 2px var(--linha)}
.cores .op input:checked+span{box-shadow:0 0 0 3px var(--azul)}
.divisor{display:flex;align-items:center;gap:12px;color:var(--cinza);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.divisor::before,.divisor::after{content:"";flex:1;height:1px;background:var(--linha)}
.teste{display:grid;gap:8px}
.teste button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px dashed var(--linha);background:var(--fundo);border-radius:14px;padding:10px 14px;text-align:left}
.teste button b{font-weight:800}
.teste button small{display:block;color:var(--cinza);font-size:12.5px}
.centro{text-align:center;color:var(--cinza);font-size:14px}

/* ---------- cabeçalhos ---------- */
.top{display:flex;align-items:center;gap:12px;padding:12px 20px 8px;position:sticky;top:0;background:var(--fundo);z-index:2}
.top h1{font-size:20px;font-weight:900;flex:1;min-width:0}
.ola{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 6px}
.ola small{display:flex;align-items:center;gap:4px;color:var(--cinza);font-weight:700;font-size:13px}
.ola h1{font-size:24px;font-weight:900}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--amarelo);color:var(--tinta);display:grid;place-items:center;font-weight:900;font-size:15px;border:0;flex:none}
.avatar.g{width:76px;height:76px;font-size:26px}
.avatar.azul{background:var(--azul-claro);color:var(--azul-escuro)}

/* ---------- home ---------- */
.destaque{margin:10px 20px 4px;background:var(--creme);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px}
.destaque b{font-size:17px;font-weight:900;display:block}
.destaque span{color:var(--cinza);font-size:13.5px}
.busca{display:flex;gap:10px;padding:12px 20px 4px}
.busca .campo-b{flex:1;position:relative;min-width:0}
.busca .campo-b .ic{position:absolute;left:14px;top:14px;color:var(--cinza)}
.busca .inp{padding-left:44px;border-color:transparent;box-shadow:0 2px 8px rgba(27,49,72,.06)}
.filtro-btn{position:relative;width:50px;height:50px;border-radius:14px;border:0;background:var(--azul-escuro);color:var(--branco);display:grid;place-items:center;flex:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--amarelo-forte);color:var(--tinta);font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid var(--fundo)}
.chips{display:flex;gap:8px;padding:12px 20px 4px;overflow-x:auto}
.chip{border:0;min-height:38px;padding:0 16px;border-radius:19px;background:var(--branco);font-weight:800;font-size:14px;color:var(--cinza);white-space:nowrap}
.chip.on{background:var(--azul);color:var(--branco)}
.contagem{padding:14px 20px 8px;font-size:13px;color:var(--cinza);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 24px}
.card{background:var(--branco);border-radius:var(--r);overflow:hidden;border:0;padding:0;text-align:left;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(27,49,72,.06);position:relative;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .arte{aspect-ratio:5/4;display:block;width:100%}
.card .arte svg{display:block;width:100%;height:100%}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .nome{font-weight:900;font-size:16px;display:flex;align-items:center;gap:6px}
.card .meta{font-size:12.5px;color:var(--cinza);font-weight:600}
.card .local{font-size:12px;color:var(--azul-escuro);font-weight:700;display:flex;align-items:center;gap:3px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--azul-escuro)}
.fav.on{color:#E0566A}
.sexo{font-size:12px;font-weight:900;width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;background:var(--azul-claro);color:var(--azul-escuro)}
.sexo.F{background:#FDE7EC;color:#B23A57}
.vazio{margin:24px 20px;padding:28px 20px;border-radius:var(--r);background:var(--branco);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.vazio b{font-size:17px;font-weight:900}
.vazio p{color:var(--cinza);font-size:14px}

/* ---------- detalhe ---------- */
.det-hero{position:relative;aspect-ratio:5/4;flex:none}
.det-hero svg.pet-art{display:block;width:100%;height:100%}
.det-hero .barra{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between}
.det-corpo{background:var(--fundo);border-radius:28px 28px 0 0;margin-top:-28px;position:relative;padding:22px 20px 24px;display:flex;flex-direction:column;gap:20px;flex:1}
.det-titulo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.det-titulo h1{font-size:30px;font-weight:900}
.det-titulo .meta{color:var(--cinza);font-weight:700}
.det-titulo .local{display:flex;align-items:center;gap:4px;color:var(--azul-escuro);font-weight:700;font-size:14px;margin-top:6px}
.fatos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fato{background:var(--branco);border-radius:14px;padding:10px 6px;text-align:center}
.fato span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--cinza)}
.fato b{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
.secao h2{font-size:16px;font-weight:900;margin-bottom:10px}
.secao p{color:var(--cinza)}
.saude{display:flex;flex-wrap:wrap;gap:8px}
.saude span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-weight:800;font-size:13px;background:var(--ok-bg);color:var(--ok)}
.saude span.nao{background:var(--branco);color:var(--cinza);border:1.5px dashed var(--linha)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:7px 12px;border-radius:10px;background:var(--creme);font-weight:800;font-size:13px;color:#6A5000}
.protetor{background:var(--branco);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.protetor b{display:block;font-weight:900}
.protetor small{color:var(--cinza);font-size:13px}
.cta-bar{position:sticky;bottom:0;background:var(--branco);padding:12px 20px;border-top:1px solid var(--linha);display:flex;gap:10px;align-items:center;z-index:2}
.cta-bar .btn{flex:1}

/* ---------- status / listas ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:900;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.analise{background:var(--aviso-bg);color:var(--aviso)}
.pill.aprovada,.pill.disponivel{background:var(--ok-bg);color:var(--ok)}
.pill.recusada{background:var(--erro-bg);color:var(--erro)}
.pill.cancelada{background:var(--linha);color:var(--cinza)}
.pill.adotado{background:var(--azul-claro);color:var(--azul-escuro)}
.lista{display:flex;flex-direction:column;gap:10px;padding:8px 20px 24px}
.item{background:var(--branco);border:0;border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center;text-align:left;width:100%;box-shadow:0 2px 8px rgba(27,49,72,.05)}
.thumb{width:62px;height:62px;border-radius:14px;overflow:hidden;flex:none}
.thumb svg{display:block;width:100%;height:100%}
.item .meio{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .meio b{font-weight:900;font-size:15.5px}
.item .meio small{color:var(--cinza);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.item .ic.seta{color:var(--cinza)}
.segmento{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--linha);padding:4px;border-radius:14px;margin:6px 20px 4px}
.segmento button{border:0;background:none;min-height:40px;border-radius:10px;font-weight:800;font-size:14px;color:var(--cinza)}
.segmento button.on{background:var(--branco);color:var(--tinta);box-shadow:0 1px 4px rgba(27,49,72,.1)}
.titulo-sec{padding:18px 20px 4px;font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--azul-escuro);display:flex;justify-content:space-between;align-items:center}

/* ---------- painel do protetor ---------- */
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 20px 4px}
.numero{background:var(--branco);border-radius:var(--r);padding:14px 12px}
.numero b{display:block;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.numero span{font-size:12px;font-weight:700;color:var(--cinza);line-height:1.25;display:block}
.numero.alerta-n{background:var(--amarelo)}
.numero.alerta-n span{color:var(--tinta)}

/* ---------- solicitação ---------- */
.bloco{background:var(--branco);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.bloco h2{font-size:16px;font-weight:900}
.linha-tl{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative}
.linha-tl:not(:last-child)::after{content:"";position:absolute;left:10px;top:24px;bottom:-14px;width:2px;background:var(--linha)}
.linha-tl .pt{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--azul-claro);color:var(--azul-escuro)}
.linha-tl .pt.aprovada{background:var(--ok-bg);color:var(--ok)}
.linha-tl .pt.recusada{background:var(--erro-bg);color:var(--erro)}
.linha-tl .pt.analise{background:var(--aviso-bg);color:var(--aviso)}
.linha-tl .pt.cancelada{background:var(--linha);color:var(--cinza)}
.linha-tl b{font-weight:900;font-size:14.5px}
.linha-tl small{display:block;color:var(--cinza);font-size:12.5px;font-variant-numeric:tabular-nums}
.linha-tl p{font-size:14px;margin-top:4px;color:var(--tinta)}
.resp{display:grid;gap:10px}
.resp div{display:flex;flex-direction:column;gap:1px;border-bottom:1px solid var(--linha);padding-bottom:10px}

.sucesso .acoes{display:grid;gap:10px;width:100%;margin-top:10px}

.perfil-cab{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 20px 18px;text-align:center}

.perfil-cab small{color:var(--cinza);font-weight:600}
.menu{margin:0 20px;background:var(--branco);border-radius:var(--r);overflow:hidden}

.menu .m span{flex:1;min-width:0}

.menu button span{flex:1}
.menu .sair{color:var(--erro)}
.versao{text-align:center;color:var(--cinza);font-size:12px;padding:18px 20px 28px}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--branco);border-top:1px solid var(--linha);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:800;color:var(--cinza);position:relative}
.tabbar button.on{color:var(--azul-escuro)}
.tabbar button.on .ic{stroke-width:2.5}
.tabbar .badge{top:0;right:calc(50% - 22px)}
.tabbar .mais .bola{width:44px;height:32px;border-radius:12px;background:var(--amarelo);display:grid;place-items:center;color:var(--tinta)}

/* ---------- sheet / toast ---------- */
.veu{position:absolute;inset:0;background:rgba(19,42,64,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .18s ease}

.sheet h2{font-size:20px;font-weight:900;margin-bottom:6px}
.sheet .txt{color:var(--cinza);margin-bottom:16px}

.sheet .guia-m h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--azul-escuro);font-weight:900;margin:16px 0 8px}
@keyframes fade{from{opacity:0}}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}}
#toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--tinta);color:var(--branco);padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(19,42,64,.3);animation:sobe .2s ease;max-width:100%}
.mini{display:flex;gap:12px;align-items:center;background:var(--branco);border-radius:var(--r);padding:10px;margin:4px 20px 0}

.mini small{color:var(--cinza);font-size:13px}
.screen.branca{background:var(--branco)}
.screen.branca .top{background:var(--branco)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------------- "API" simulada (persistência local) ---------------- */
const KEY='findhome-prototipo-v1';
function carregar(){try{const r=localStorage.getItem(KEY);if(!r)return null;const d=JSON.parse(r);return d&&d.versao===1?d:null;}catch(e){return null;}}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
let db=carregar()||seed();

const API={
  login(email,senha){const u=db.users.find(x=>x.email.toLowerCase()===email.toLowerCase());if(!u||u.senha!==senha)return{erro:'E-mail ou senha incorretos. Confira os dados ou use um dos acessos de teste abaixo.'};db.sessao=u.id;salvar();return{user:u};},
  logout(){db.sessao=null;salvar();},
  cadastrar(d){if(db.users.some(x=>x.email.toLowerCase()===d.email.toLowerCase()))return{erro:{email:'Já existe uma conta com este e-mail. Entre com ele ou use outro.'}};const u={id:'u'+Date.now(),nome:d.nome,email:d.email,senha:d.senha,tipo:d.tipo,telefone:d.telefone,cidade:d.cidade,desde:String(new Date().getFullYear())};db.users.push(u);db.sessao=u.id;salvar();return{user:u};},
  user:id=>db.users.find(u=>u.id===id),
  pet:id=>db.pets.find(p=>p.id===id),
  req:id=>db.reqs.find(r=>r.id===id),
  petsDisponiveis(){return db.pets.filter(p=>p.status==='disponivel');},
  favs(uid){return db.favs[uid]||[];},
  toggleFav(uid,pid){const l=db.favs[uid]=db.favs[uid]||[];const i=l.indexOf(pid);if(i>=0)l.splice(i,1);else l.push(pid);salvar();return i<0;},
  reqsDoAdotante(uid){return db.reqs.filter(r=>r.adotanteId===uid).sort((a,b)=>b.criadaEm.localeCompare(a.criadaEm));},
  reqsDoProtetor(uid){const ids=db.pets.filter(p=>p.protetorId===uid).map(p=>p.id);return db.reqs.filter(r=>ids.includes(r.petId)).sort((a,b)=>b.criadaEm.localeCompare(a.criadaEm));},
  reqAtiva(uid,pid){return db.reqs.find(r=>r.adotanteId===uid&&r.petId===pid&&(r.status==='analise'||r.status==='aprovada'));},
  solicitar(uid,pid,respostas){
    const pet=API.pet(pid),agora=new Date().toISOString(),ong=API.user(pet.protetorId);
    const r={id:'r'+Date.now(),protocolo:'FH-'+new Date().getFullYear()+'-'+String(++db.seq).padStart(4,'0'),petId:pid,adotanteId:uid,status:'analise',criadaEm:agora,respostas,
      historico:[{status:'enviada',data:agora},{status:'analise',data:agora,nota:`${ong.nome} recebeu seu pedido e vai analisar.`}]};
    db.reqs.push(r);salvar();return r;
  },
  cancelar(rid){const r=API.req(rid);r.status='cancelada';r.historico.push({status:'cancelada',data:new Date().toISOString(),nota:'Você cancelou este pedido.'});salvar();},
  responder(rid,aprovar,nota){
    const r=API.req(rid),agora=new Date().toISOString(),pet=API.pet(r.petId);
    r.status=aprovar?'aprovada':'recusada';
    r.historico.push({status:r.status,data:agora,nota:nota||(aprovar?'Pedido aprovado. Entraremos em contato para combinar a entrega.':'Pedido recusado pelo protetor.')});
    let afetados=0;
    if(aprovar){
      pet.status='adotado';
      db.reqs.filter(x=>x.petId===pet.id&&x.id!==r.id&&x.status==='analise').forEach(x=>{x.status='recusada';x.historico.push({status:'recusada',data:agora,nota:`${pet.nome} foi adotado(a) por outra família. Que tal conhecer outros pets?`});afetados++;});
    }
    salvar();return afetados;
  },
  cadastrarPet(uid,d){const p=Object.assign({id:'p'+Date.now(),protetorId:uid,status:'disponivel',criadoEm:new Date().toISOString(),km:+(1+Math.random()*9).toFixed(1)},d);db.pets.unshift(p);salvar();return p;},
  resetar(){const s=db.sessao;db=seed();db.sessao=s&&db.users.some(u=>u.id===s)?s:null;salvar();}
};

const S={screen:'splash',params:{},stack:[],onb:0,seg:'pendentes',sheet:null,

const ehProtetor=()=>eu()&&eu().tipo==='protetor';
const inicio=()=>ehProtetor()?'painel':'home';
const app=document.getElementById('app');

function go(screen,params={},opt={}){
  if(opt.root)S.stack=[];else if(!opt.replace)S.stack.push({screen:S.screen,params:S.params});
  S.screen=screen;S.params=params;S.sheet=null;render();
}
function back(){const p=S.stack.pop();if(!p){go(eu()?inicio():'login',{}, {root:true});return;}S.screen=p.screen;S.params=p.params;S.sheet=null;render();}

function render(keep){
  const sc=app.querySelector('.screen');const top=keep&&sc?sc.scrollTop:0;
  const fn=SCREENS[S.screen]||SCREENS.home;const out=fn(S.params)||{};
  app.innerHTML=`<div class="screen ${out.cls||''}" data-tela="${S.screen}">${out.html}</div>${out.nav?tabbar():''}${sheetHtml()}`;
  const ns=app.querySelector('.screen');ns.scrollTop=top;
  if(out.after)out.after();
}

function tabbar(){

    ['painel','home','Painel',['painel']],

function mostrarErros(form,erros){
  form.querySelectorAll('[data-err]').forEach(e=>e.textContent='');
  form.querySelectorAll('.inv').forEach(e=>e.classList.remove('inv'));
  let primeiro=null;
  Object.entries(erros).forEach(([k,v])=>{const e=form.querySelector(`[data-err="${k}"]`);if(e)e.textContent=v;const i=form.querySelector(`#${k}`);if(i){i.classList.add('inv');primeiro=primeiro||i;}else{primeiro=primeiro||e;}});
  if(primeiro){primeiro.scrollIntoView({block:'center'});if(primeiro.focus)primeiro.focus({preventScroll:true});}
  return Object.keys(erros).length===0;
}

/* ---------------- filtros ---------------- */
function nFiltros(){const f=S.filtros;return f.portes.length+(f.idade!=='qualquer')+(f.sexo!=='qualquer')+(f.dist!=='qualquer');}
function filtrar(){
  const f=S.filtros,q=f.q.trim().toLowerCase();
  return API.petsDisponiveis().filter(p=>
    (f.especie==='todos'||p.especie===f.especie)&&
    (!f.portes.length||f.portes.includes(p.porte))&&
    (f.idade==='qualquer'||faixa(p.idade)===f.idade)&&
    (f.sexo==='qualquer'||p.sexo===f.sexo)&&
    (f.dist==='qualquer'||p.km<=Number(f.dist))&&
    (!q||p.nome.toLowerCase().includes(q)||p.bairro.toLowerCase().includes(q)||p.temperamento.join(' ').toLowerCase().includes(q))
  ).sort((a,b)=>a.km-b.km);
}
function listaHome(){
  const l=filtrar();
  const cont=`<div class="contagem"><span>${l.length} ${l.length===1?'pet encontrado':'pets encontrados'}</span>${nFiltros()||S.filtros.q||S.filtros.especie!=='todos'?'<button class="link" data-act="limparFiltros">Limpar filtros</button>':'<span>Mais perto primeiro</span>'}</div>`;
  if(!l.length)return cont+vazio('Nenhum pet com esses filtros','Tente ampliar a distância ou remover algum filtro.','<button class="btn peq" data-act="limparFiltros">Limpar filtros</button>');
  return cont+`<div class="grade">${l.map(cardPet).join('')}</div>`;
}

function itemReq(r){const p=API.pet(r.petId),a=API.user(r.adotanteId);
  return `<button class="item" data-act="go" data-to="avaliar" data-id="${r.id}"><span class="thumb">${petArt(p,false)}</span><span class="meio"><b>${esc_(a.nome)}</b><small>quer adotar ${esc_(p.nome)} · ${dataBR(r.criadaEm)}</small><span>${pill(r.status)}</span></span>${icon('chevron','seta')}</button>`;}
function timeline(r){return r.historico.slice().reverse().map(h=>`<div class="linha-tl"><span class="pt ${h.status}">${icon(h.status==='recusada'||h.status==='cancelada'?'x':h.status==='analise'?'clock':'check','sm')}</span><div><b>${STATUS_REQ[h.status]}</b><small>${dataHoraBR(h.data)}</small>${h.nota?`<p>${esc_(h.nota)}</p>`:''}</div></div>`).join('');}
function respostas(r){const R=r.respostas,L=[['moradia','Moradia'],['imovel','Imóvel'],['tela','Tela nas janelas'],['moradores','Pessoas na casa'],['outrosPets','Outros animais'],['horas','Tempo sozinho por dia'],['motivo','Por que quer adotar']];
  return `<div class="resp">${L.filter(([k])=>R[k]).map(([k,l])=>`<div><span>${l}</span><b>${esc_(R[k])}</b></div>`).join('')}</div>`;}

      <div class="grupo"><b>Sexo</b>${radios('sexo',[['qualquer','Qualquer'],['F','Fêmea'],['M','Macho']],f.sexo)}</div>
      <div class="grupo"><b>Distância</b>${radios('dist',[['qualquer','Qualquer'],['3','Até 3 km'],['5','Até 5 km'],['10','Até 10 km']],f.dist)}</div>
      <div class="acoes"><button type="button" class="btn sec" data-act="limparFiltros">Limpar</button><button class="btn" type="submit">Ver resultados</button></div></form>`;}
  else if(s.tipo==='sobre'){c=`<h2>Sobre este protótipo</h2><div class="guia-m">${guiaHtml()}</div><div class="acoes" style="grid-template-columns:1fr"><button class="btn sec" data-act="fecharSheet">Fechar</button></div>`;}
  else if(s.tipo==='confirm'){const cfg=CONFIRM[s.acao](s.id);
    c=`<h2>${cfg.titulo}</h2><p class="txt">${cfg.texto}</p>${cfg.nota?`<div class="campo" style="margin-bottom:16px"><label for="nota">${cfg.nota}</label><textarea class="inp" id="nota" maxlength="300" placeholder="Opcional" style="min-height:84px"></textarea></div>`:''}
      <div class="acoes"><button class="btn sec" data-act="fecharSheet">Voltar</button><button class="btn ${cfg.perigo?'perigo':''}" data-act="executar">${cfg.botao}</button></div>`;}
  return `<div class="veu" data-act="veu"><div class="sheet" role="dialog" aria-modal="true" aria-label="${s.tipo}"><div class="alca"></div>${c}</div></div>`;
}
const CONFIRM={
  cancelar:id=>{const p=API.pet(API.req(id).petId);return{titulo:'Cancelar este pedido?',texto:`O protetor deixa de analisar seu pedido para ${p.nome}. Você pode pedir de novo depois.`,botao:'Cancelar pedido',perigo:true,run(){API.cancelar(id);S.sheet=null;render(true);toast('Pedido cancelado.');}};},
  aprovar:id=>{const r=API.req(id),p=API.pet(r.petId),a=API.user(r.adotanteId);const outros=db.reqs.filter(x=>x.petId===p.id&&x.id!==id&&x.status==='analise').length;
    return{titulo:`Aprovar ${primeiroNome(a.nome)} para adotar ${p.nome}?`,texto:`${p.nome} sai da lista de adoção e o seu contato é liberado para ${primeiroNome(a.nome)}.${outros?` ${outros===1?'O outro pedido pendente':'Os outros '+outros+' pedidos pendentes'} para ${p.nome} ${outros===1?'será recusado':'serão recusados'} automaticamente.`:''}`,nota:'Mensagem para o adotante',botao:'Aprovar',run(){const n=API.responder(id,true,valNota());S.sheet=null;render(true);toast(`Pedido aprovado.${n?` ${n} outro${n>1?'s':''} recusado${n>1?'s':''} automaticamente.`:''}`);}};},
  recusar:id=>{const r=API.req(id),a=API.user(r.adotanteId);return{titulo:`Recusar o pedido de ${primeiroNome(a.nome)}?`,texto:'O adotante verá o status “Recusada”. Explicar o motivo ajuda quem está procurando um pet.',nota:'Motivo (o adotante verá)',botao:'Recusar',perigo:true,run(){API.responder(id,false,valNota());S.sheet=null;render(true);toast('Pedido recusado.');}};},
  resetar:()=>({titulo:'Restaurar dados de exemplo?',texto:'Pets, pedidos e contas criados durante o teste serão apagados deste navegador. Você continua conectado se estiver usando uma conta de teste.',botao:'Restaurar',perigo:true,run(){API.resetar();S.sheet=null;S.stack=[];if(!eu())go('login',{}, {root:true});else go(inicio(),{}, {root:true});toast('Dados de exemplo restaurados.');}})
};
const valNota=()=>{const n=document.getElementById('nota');return n&&n.value.trim()?n.value.trim():'';};

/* ---------------- ações ---------------- */
const ACT={
  go(d){if(d.root)go(d.to,{id:d.id},{root:true});else go(d.to,{id:d.id});},
  tab(d){if(d.to==='recebidas'&&d.pet){S.seg='pendentes';go('recebidas',{pet:d.pet});return;}go(d.to,{}, {root:true});},
  back:()=>back(),
  onbProx(){if(S.onb<ONB.length-1){S.onb++;render();}else go('login',{}, {root:true});},
  onbPular:()=>go('login',{}, {root:true}),
  preencher(d){const e=document.getElementById('email'),s=document.getElementById('senha');e.value=d.email;s.value='123456';e.classList.remove('inv');s.classList.remove('inv');document.getElementById('loginErro').textContent='';toast('Dados preenchidos. Toque em Entrar.');},
  verSenha(d,el){const i=document.getElementById(d.alvo);const v=i.type==='password';i.type=v?'text':'password';el.innerHTML=icon(v?'eyeoff':'eye');el.setAttribute('aria-label',v?'Esconder senha':'Mostrar senha');},
  esqueci:()=>toast('No protótipo, use as contas de teste. A recuperação de senha entra na versão com servidor.'),
  fav(d){const add=API.toggleFav(db.sessao,d.id);render(true);toast(add?'Adicionado aos favoritos.':'Removido dos favoritos.');},
  especie(d){S.filtros.especie=d.v;render(true);},
  abrirFiltros(){S.sheet={tipo:'filtros'};render(true);},
  limparFiltros(){S.filtros={especie:'todos',portes:[],idade:'qualquer',sexo:'qualquer',dist:'qualquer',q:''};S.sheet=null;render(true);},
  seg(d){S.seg=d.v;render(true);},
  sobre(){S.sheet={tipo:'sobre'};render(true);},
  fecharSheet(){S.sheet=null;render(true);},
  veu(d,el,e){if(e.target===el){S.sheet=null;render(true);}},
  confirmar(d){S.sheet={tipo:'confirm',acao:d.acao,id:d.id};render(true);setTimeout(()=>{const b=app.querySelector('.sheet [data-act="executar"]');b&&b.focus();},50);},
  executar(){CONFIRM[S.sheet.acao](S.sheet.id).run();},
  sair(){API.logout();S.stack=[];S.filtros.q='';go('login',{}, {root:true});toast('Você saiu da conta.');}
};
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||!app.contains(el))return;
  const a=el.dataset.act;if(a!=='veu')e.stopPropagation();
  if(ACT[a])ACT[a](el.dataset,el,e);
});
app.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card[role="button"]')){e.preventDefault();e.target.click();}
  if(e.key==='Escape'&&S.sheet){S.sheet=null;render(true);}
});
app.addEventListener('input',e=>{
  if(e.target.id==='busca'){S.filtros.q=e.target.value;document.getElementById('lista').innerHTML=listaHome();}
  if(e.target.dataset.mask==='tel'){let v=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=v.length>6?`(${v.slice(0,2)}) ${v.slice(2,v.length-4)}-${v.slice(-4)}`:v.length>2?`(${v.slice(0,2)}) ${v.slice(2)}`:v;}
  if(e.target.classList.contains('inv')){e.target.classList.remove('inv');const er=app.querySelector(`[data-err="${e.target.id}"]`);if(er)er.textContent='';}
});
app.addEventListener('change',e=>{
  if(e.target.name==='temperamento'){const ms=app.querySelectorAll('input[name="temperamento"]:checked');if(ms.length>3){e.target.checked=false;toast('Escolha no máximo 3 características.');}}
});

/* ---------------- formulários ---------------- */
const FORMS={
  login(f){const email=f.email.value.trim(),senha=f.senha.value,er={};
    if(!email)er.email='Informe seu e-mail.';else if(!emailOk(email))er.email='Digite um e-mail válido, como nome@email.com.';
    if(!senha)er.senha='Informe sua senha.';
    document.getElementById('loginErro').textContent='';
    if(!mostrarErros(f,er))return;
    const r=API.login(email,senha);
    if(r.erro){document.getElementById('loginErro').textContent=r.erro;return;}
    go(inicio(),{}, {root:true});toast(`Olá, ${primeiroNome(r.user.nome)}!`);
  },
  cadastro(f){const v=k=>(f.elements[k]?.value||'').trim(),er={};
    if(v('nome').length<3)er.nome='Informe seu nome com pelo menos 3 letras.';
    if(!emailOk(v('email')))er.cemail='Digite um e-mail válido, como nome@email.com.';
    if(v('telefone').replace(/\D/g,'').length<10)er.telefone='Informe o celular com DDD.';
    if(!v('cidade'))er.cidade='Selecione sua cidade.';
    if(f.senha.value.length<6)er.csenha='A senha precisa ter pelo menos 6 caracteres.';
    if(f.senha2.value!==f.senha.value)er.csenha2='As senhas não são iguais.';
    if(!f.termos.checked)er.termos='Para criar a conta, aceite os termos.';
    if(!mostrarErros(f,er))return;
    const r=API.cadastrar({tipo:f.tipo.value,nome:v('nome'),email:v('email'),telefone:v('telefone'),cidade:v('cidade'),senha:f.senha.value});
    if(r.erro){mostrarErros(f,{cemail:r.erro.email});return;}
    go(inicio(),{}, {root:true});toast(`Conta criada. Boas-vindas, ${primeiroNome(r.user.nome)}!`);
  },
  adotar(f){const er={},val=n=>{const el=f.elements[n];return el?(el.value||'').trim():'';};
    if(!val('moradia'))er.moradia='Escolha o tipo de moradia.';
    if(!val('imovel'))er.imovel='Informe se o imóvel é próprio ou alugado.';
    if(!val('tela'))er.tela='Selecione uma opção.';
    else if(val('moradia')==='Apartamento'&&val('tela')==='Não se aplica')er.tela='Para apartamento, informe se as janelas têm tela.';
    const m=Number(val('moradores'));if(!m||m<1||m>20)er.moradores='Informe um número entre 1 e 20.';
    if(!val('outrosPets'))er.outrosPets='Selecione Sim ou Não.';
    if(!val('horas'))er.horas='Selecione uma opção.';
    if(val('motivo').length<20)er.motivo=`Escreva pelo menos 20 caracteres (agora: ${val('motivo').length}).`;
    if(!f.ciente.checked)er.ciente='Confirme que está ciente para enviar o pedido.';
    if(!mostrarErros(f,er))return;
    const pid=f.dataset.id;
    if(API.reqAtiva(db.sessao,pid)){toast('Você já tem um pedido ativo para este pet.');return;}
    const r=API.solicitar(db.sessao,pid,{moradia:val('moradia'),imovel:val('imovel'),tela:val('tela'),moradores:val('moradores'),outrosPets:val('outrosPets'),horas:val('horas'),motivo:val('motivo')});
    S.stack=S.stack.filter(x=>x.screen!=='adotar');go('enviada',{id:r.id},{replace:true});
  },
  novoPet(f){const er={},val=n=>{const el=f.elements[n];return el?(el.value||'').trim():'';};
    if(val('nome').length<2)er.pnome='Informe o nome do pet.';
    if(!val('sexo'))er.sexo='Escolha o sexo.';
    const idade=Number(val('idade'));if(!idade||idade<1)er.idade='Informe a idade.';else if(val('unidade')==='meses'&&idade>24)er.idade='Acima de 24 meses, use anos.';
    if(!val('porte'))er.porte='Selecione o porte.';
    if(val('bairro').length<3)er.bairro='Informe o bairro.';
    const temp=[...f.querySelectorAll('input[name="temperamento"]:checked')].map(i=>i.value);if(!temp.length)er.temperamento='Escolha pelo menos uma característica.';
    if(val('descricao').length<30)er.descricao=`Escreva pelo menos 30 caracteres (agora: ${val('descricao').length}).`;
    if(!mostrarErros(f,er))return;
    const sd={};['vacinado','castrado','vermifugado'].forEach(k=>sd[k]=!!f.querySelector(`input[name="saude"][value="${k}"]:checked`));
    const esp=val('especie');const u=eu();
    const p=API.cadastrarPet(u.id,{nome:val('nome'),especie:esp,sexo:val('sexo'),idade:val('unidade')==='anos'?idade*12:idade,porte:val('porte'),peso:val('peso')?Number(val('peso')):null,bairro:val('bairro'),cidade:u.cidade,saude:sd,temperamento:temp,descricao:val('descricao'),cor:val('cor'),bg:esp==='gato'?'#E5EFF9':'#FFF1C4',lingua:esp==='cao',olho:'#4F7F2E'});
    go('painel',{}, {root:true});go('pet',{id:p.id});toast(`${p.nome} foi publicado e já aparece para os adotantes.`);
  },
  filtros(f){S.filtros.portes=[...f.querySelectorAll('input[name="portes"]:checked')].map(i=>i.value);S.filtros.idade=f.idade.value;S.filtros.sexo=f.sexo.value;S.filtros.dist=f.dist.value;S.sheet=null;render(true);}
};
app.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();FORMS[f.dataset.form](f);});

/* ---------------- guia lateral (desktop) ---------------- */
document.getElementById('guia').innerHTML=`<div class="marca">${logoMark(56)}${wordmark(26)}</div><h2>Protótipo do app</h2>${guiaHtml()}<div class="rodape"><button class="btn sec peq" id="guiaReset">${icon('refresh')} Restaurar dados de exemplo</button></div>`;
document.getElementById('guiaReset').addEventListener('click',()=>{S.sheet={tipo:'confirm',acao:'resetar'};render(true);});

/* ---------------- início ---------------- */
render();
window.FindHome={db:()=>db,go,API};
})();
</script>
